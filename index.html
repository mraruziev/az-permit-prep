<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Free interactive Arizona MVD permit test prep: 8 narrated animated lessons, 166 practice questions, 30-question mock exams, road sign drills and a cheat sheet.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23125A42'/%3E%3Ccircle cx='50' cy='27' r='11' fill='%23E8604F'/%3E%3Ccircle cx='50' cy='52' r='11' fill='%23F6C244'/%3E%3Ccircle cx='50' cy='77' r='11' fill='%234FBE8A'/%3E%3C/svg%3E">
<title>Arizona Permit Prep</title>
<style>
:root{
  --font-display:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;

  --ground:#E7ECE6;
  --surface:#FFFFFF;
  --surface-2:#F2F6F0;
  --ink:#0F1A14;
  --ink-2:#465349;
  --ink-3:#78877D;
  --line:#D4DCD1;
  --line-2:#BFCABB;

  --guide:#125A42;
  --on-guide:#FFFFFF;
  --accent:#0E6A4B;
  --accent-soft:#DDEDE4;

  --signal:#9A6A04;
  --signal-soft:#FAF0D6;
  --stop:#A82B1F;
  --stop-soft:#FAE6E3;
  --go:#146F49;
  --go-soft:#DFF0E7;

  --asphalt:#39413B;
  --plate-yellow:#F6C244;

  --shadow:0 1px 2px rgba(15,26,20,.05),0 10px 28px -16px rgba(15,26,20,.35);
  --radius:14px;
}
.theme-dark{
  --ground:#0A100D;
  --surface:#131B17;
  --surface-2:#1A241E;
  --ink:#E6EDE7;
  --ink-2:#A0B1A6;
  --ink-3:#6E7F75;
  --line:#243029;
  --line-2:#32423A;
  --guide:#0F5B41;
  --on-guide:#FFFFFF;
  --accent:#54C393;
  --accent-soft:#12291F;
  --signal:#E8B65C;
  --signal-soft:#2A2214;
  --stop:#E86E60;
  --stop-soft:#2E1815;
  --go:#4FBE8A;
  --go-soft:#12291F;
  --asphalt:#2B322D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.9);
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#0A100D;
    --surface:#131B17;
    --surface-2:#1A241E;
    --ink:#E6EDE7;
    --ink-2:#A0B1A6;
    --ink-3:#6E7F75;
    --line:#243029;
    --line-2:#32423A;
    --guide:#0F5B41;
    --on-guide:#FFFFFF;
    --accent:#54C393;
    --accent-soft:#12291F;
    --signal:#E8B65C;
    --signal-soft:#2A2214;
    --stop:#E86E60;
    --stop-soft:#2E1815;
    --go:#4FBE8A;
    --go-soft:#12291F;
    --asphalt:#2B322D;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#0A100D;
  --surface:#131B17;
  --surface-2:#1A241E;
  --ink:#E6EDE7;
  --ink-2:#A0B1A6;
  --ink-3:#6E7F75;
  --line:#243029;
  --line-2:#32423A;
  --guide:#0F5B41;
  --on-guide:#FFFFFF;
  --accent:#54C393;
  --accent-soft:#12291F;
  --signal:#E8B65C;
  --signal-soft:#2A2214;
  --stop:#E86E60;
  --stop-soft:#2E1815;
  --go:#4FBE8A;
  --go-soft:#12291F;
  --asphalt:#2B322D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.9);
}
:root[data-theme="light"]{
  --ground:#E7ECE6;
  --surface:#FFFFFF;
  --surface-2:#F2F6F0;
  --ink:#0F1A14;
  --ink-2:#465349;
  --ink-3:#78877D;
  --line:#D4DCD1;
  --line-2:#BFCABB;
  --guide:#125A42;
  --on-guide:#FFFFFF;
  --accent:#0E6A4B;
  --accent-soft:#DDEDE4;
  --signal:#9A6A04;
  --signal-soft:#FAF0D6;
  --stop:#A82B1F;
  --stop-soft:#FAE6E3;
  --go:#146F49;
  --go-soft:#DFF0E7;
  --asphalt:#39413B;
  --shadow:0 1px 2px rgba(15,26,20,.05),0 10px 28px -16px rgba(15,26,20,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-body);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---- masthead ---- */
.masthead{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.masthead-in{display:flex;align-items:center;gap:14px;padding:12px 20px;max-width:1000px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;background:none;border:0;padding:0}
.marker{width:34px;height:44px;border-radius:3px;background:var(--guide);color:#fff;
  border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px var(--guide);
  display:grid;place-items:center;font-family:var(--font-display);font-weight:800;
  font-size:14px;letter-spacing:.04em;flex:none}
.brand-txt{text-align:left;line-height:1.15}
.brand-txt b{display:block;font-family:var(--font-display);font-weight:800;font-size:16px;letter-spacing:-.01em}
.brand-txt span{display:block;font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav button{background:none;border:1px solid transparent;padding:7px 12px;border-radius:99px;
  font-size:13.5px;font-weight:600;color:var(--ink-2)}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 28%,transparent)}

/* ---- generic ---- */
.eyebrow{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
main{padding:28px 0 72px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;
  border:1px solid var(--line-2);background:var(--surface);padding:11px 18px;
  font-weight:650;font-size:15px;transition:transform .12s,background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--guide);color:var(--on-guide);border-color:var(--guide)}
.btn-primary:hover{background:color-mix(in srgb,var(--guide) 86%,#000);border-color:transparent}
.btn-lg{padding:15px 26px;font-size:16.5px}
.btn-sm{padding:8px 13px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;
  font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip-go{background:var(--go-soft);color:var(--go);border-color:color-mix(in srgb,var(--go) 25%,transparent)}
.chip-stop{background:var(--stop-soft);color:var(--stop);border-color:color-mix(in srgb,var(--stop) 25%,transparent)}
.chip-warn{background:var(--signal-soft);color:var(--signal);border-color:color-mix(in srgb,var(--signal) 30%,transparent)}

/* ---- road progress ---- */
.road{position:relative;height:14px;border-radius:7px;background:var(--asphalt);overflow:hidden}
.road-fill{position:absolute;left:0;top:0;bottom:0;width:var(--pct,0%);
  background:linear-gradient(90deg,var(--guide),color-mix(in srgb,var(--guide) 55%,var(--accent)));
  transition:width .4s cubic-bezier(.4,0,.2,1)}
.road-dash{position:absolute;left:0;right:0;top:50%;height:2px;transform:translateY(-1px);
  background:repeating-linear-gradient(90deg,var(--plate-yellow) 0 11px,transparent 11px 25px);opacity:.85}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}
/* ---- hero ---- */
.hero{display:grid;gap:18px;padding:8px 0 34px}
.hero h1{font-size:clamp(34px,6.2vw,54px);line-height:1.02;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero-sub{font-size:17.5px;color:var(--ink-2);max-width:60ch}
.hero-cta{display:flex;gap:11px;flex-wrap:wrap;margin-top:4px}
.hero-note{font-size:13.5px;color:var(--ink-3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---- stat strip ---- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:30px}
.stat{background:var(--surface);padding:15px 16px;display:flex;flex-direction:column;gap:3px}
.stat-v{font-family:var(--font-display);font-weight:800;font-size:25px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.1}
.stat-l{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}

/* ---- mode cards ---- */
.section-head{display:flex;align-items:baseline;gap:12px;margin:34px 0 14px}
.section-head h2{font-size:20px}
.section-head .rule{flex:1;height:1px;background:var(--line)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:14px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow);
  transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-2px);border-color:var(--accent)}
.mode-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mode h3{font-size:16.5px}
.mode p{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.mode-meta{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}
.mode:disabled{opacity:.5}
.mode:disabled:hover{transform:none;border-color:var(--line)}

/* ---- topic list ---- */
.topics{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden}
.topic{display:grid;grid-template-columns:1fr 96px 62px;align-items:center;gap:14px;
  background:var(--surface);border:0;padding:13px 16px;text-align:left;transition:background .15s}
.topic:hover{background:var(--surface-2)}
.topic-n{font-weight:650;font-size:14.5px}
.topic-n small{display:block;font-weight:400;font-size:12px;color:var(--ink-3)}
.meter{height:7px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);width:var(--pct,0%)}
.topic-p{font-family:var(--font-mono);font-size:13px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){.topic{grid-template-columns:1fr 56px}.topic .meter{display:none}}

/* ---- quiz runner ---- */
.runner{display:flex;flex-direction:column;gap:16px}
.runner-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mile{display:flex;align-items:center;gap:0;font-family:var(--font-mono);font-weight:700;
  font-size:13px;background:var(--guide);color:var(--on-guide);padding:5px 11px;border-radius:4px;
  letter-spacing:.05em;font-variant-numeric:tabular-nums;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.runner-title{font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:-.01em}
.runner-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.tally{font-family:var(--font-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tally b{color:var(--go)}
.tally i{font-style:normal;color:var(--stop)}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px}
.qtext{font-family:var(--font-display);font-weight:700;font-size:clamp(19px,2.6vw,23px);
  line-height:1.32;letter-spacing:-.018em;text-wrap:balance}
.qsign{display:grid;place-items:center;padding:16px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:10px}
.qsign svg{width:150px;height:150px}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:13px;text-align:left;width:100%;
  background:var(--surface);border:1.5px solid var(--line-2);border-radius:11px;
  padding:14px 15px;font-size:15.5px;line-height:1.4;transition:border-color .13s,background .13s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt .key{flex:none;width:26px;height:26px;border-radius:6px;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-mono);
  font-size:12.5px;font-weight:700;color:var(--ink-2);margin-top:1px}
.opt.is-picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.is-picked .key{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.opt.is-right{border-color:var(--go);background:var(--go-soft)}
.opt.is-right .key{background:var(--go);color:#fff;border-color:var(--go)}
.opt.is-wrong{border-color:var(--stop);background:var(--stop-soft)}
.opt.is-wrong .key{background:var(--stop);color:#fff;border-color:var(--stop)}
.opt.is-dim{opacity:.55}

.feedback{border-radius:11px;padding:15px 17px;display:flex;flex-direction:column;gap:6px;
  border-left:4px solid var(--go);background:var(--go-soft)}
.feedback.bad{border-left-color:var(--stop);background:var(--stop-soft)}
.feedback b{font-family:var(--font-display);font-weight:800;font-size:13px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--go)}
.feedback.bad b{color:var(--stop)}
.feedback p{font-size:14.5px;color:var(--ink-2);line-height:1.5}
.runner-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hint{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.03em}
@media (max-width:560px){.hint{display:none}.qcard{padding:18px}}

/* ---- results ---- */
.panel{background:var(--guide);color:var(--on-guide);border-radius:var(--radius);
  padding:30px 28px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),var(--shadow);
  display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.panel-verdict{font-family:var(--font-display);font-weight:800;
  font-size:clamp(38px,8vw,62px);letter-spacing:-.03em;line-height:1;text-transform:uppercase}
.panel-score{font-family:var(--font-mono);font-size:19px;letter-spacing:.05em;
  font-variant-numeric:tabular-nums;opacity:.95}
.panel-note{font-size:14.5px;opacity:.85;max-width:44ch}
.panel.fail{background:var(--asphalt)}
.rev{display:flex;flex-direction:column;gap:11px}
.rev-item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--stop);
  border-radius:10px;padding:15px 17px;display:flex;flex-direction:column;gap:7px}
.rev-q{font-weight:650;font-size:15px;line-height:1.4}
.rev-line{font-size:14px;color:var(--ink-2)}
.rev-line b{color:var(--go);font-weight:650}
.rev-line s{color:var(--stop);text-decoration-thickness:1px}
.rev-why{font-size:13.5px;color:var(--ink-3);line-height:1.5;padding-top:2px;border-top:1px dashed var(--line)}
.rev-sign{width:76px;height:76px;flex:none}
.rev-sign svg{width:100%;height:100%;display:block}

/* ---- sign chart ---- */
.signgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:13px}
.signcard{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:15px;
  display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;box-shadow:var(--shadow)}
.signcard svg{width:88px;height:88px}
.signcard h4{font-size:13.5px;letter-spacing:-.005em}
.signcard p{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.sgn text{font-family:var(--font-display);font-weight:800;text-anchor:middle;dominant-baseline:central}

/* ---- cheat sheet ---- */
.sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.sheet-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow)}
.sheet-card h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);
  margin-bottom:12px;padding-bottom:9px;border-bottom:2px solid var(--accent-soft)}
.sheet-card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:baseline}
.sheet-card dt{font-family:var(--font-mono);font-weight:700;font-size:14px;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet-card dd{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.45}

/* ---- history ---- */
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink-3);font-weight:650;padding:0 14px 9px;border-bottom:1px solid var(--line)}
.hist td{padding:11px 14px;border-bottom:1px solid var(--line)}
.hist tr:last-child td{border-bottom:0}
.hist td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

.empty{padding:30px;text-align:center;color:var(--ink-3);font-size:14.5px}
.disclaimer{margin-top:44px;padding:16px 18px;border:1px dashed var(--line-2);border-radius:11px;
  font-size:13px;color:var(--ink-3);line-height:1.55}
.disclaimer b{color:var(--ink-2)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.switch input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
/* ---- lesson player ---- */
.lessongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;
  transition:transform .15s,border-color .15s}
.lcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.lcard-art{aspect-ratio:16/9;background:#141B19;position:relative;display:block;width:100%}
.lcard-art canvas{width:100%;height:100%;display:block}
.lcard-dur{position:absolute;right:8px;bottom:8px;font-family:var(--font-mono);font-size:11px;
  color:#fff;background:rgba(0,0,0,.65);padding:3px 7px;border-radius:4px;font-variant-numeric:tabular-nums}
.lcard-seen{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:#fff;background:var(--go);padding:3px 8px;border-radius:4px}
.lcard-b{padding:14px 15px;display:flex;flex-direction:column;gap:5px}
.lcard-b h3{font-size:15.5px}
.lcard-b p{font-size:13px;color:var(--ink-2);line-height:1.45}
.lcard-b .mode-meta{margin-top:2px}

.player{display:flex;flex-direction:column;gap:14px}
.stage{position:relative;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;
  background:#141B19;border:1px solid var(--line);box-shadow:var(--shadow)}
.stage canvas{width:100%;height:100%;display:block}
.stage-veil{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,14,12,.5);
  opacity:0;pointer-events:none;transition:opacity .18s}
.stage.is-paused .stage-veil{opacity:1;pointer-events:auto}
.bigplay{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.95);color:#111;
  border:0;display:grid;place-items:center;box-shadow:0 8px 26px rgba(0,0,0,.45);cursor:pointer}
.bigplay svg{width:30px;height:30px;margin-left:3px}
.scene-tag{position:absolute;left:13px;top:13px;font-family:var(--font-mono);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);
  padding:5px 10px;border-radius:5px}

.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ctrl{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--line-2);
  background:var(--surface);display:grid;place-items:center;transition:border-color .15s,background .15s}
.ctrl:hover{border-color:var(--accent);background:var(--accent-soft)}
.ctrl svg{width:17px;height:17px;fill:currentColor}
.ctrl-main{background:var(--guide);border-color:var(--guide);color:var(--on-guide)}
.ctrl-main:hover{background:var(--guide);border-color:var(--guide);filter:brightness(1.12)}
.scrub{flex:1;min-width:130px;accent-color:var(--accent);height:6px;cursor:pointer}
.time{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:none}
.rate{font-family:var(--font-mono);font-size:12.5px;padding:8px 10px;border-radius:8px;
  border:1px solid var(--line-2);background:var(--surface);flex:none}

.caption{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:11px;padding:16px 18px;min-height:92px;display:flex;flex-direction:column;gap:7px}
.caption .eyebrow{font-size:10.5px}
.caption p{font-size:16.5px;line-height:1.5;text-wrap:balance}
.chapters{display:flex;gap:7px;flex-wrap:wrap}
.chapter{font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);transition:all .15s}
.chapter:hover{border-color:var(--accent);color:var(--ink)}
.chapter[aria-current="true"]{background:var(--accent-soft);color:var(--accent);
  border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.chapter b{font-family:var(--font-mono);font-weight:700;opacity:.65;margin-right:5px}
.transcript{display:flex;flex-direction:column;gap:10px}
.tr-scene{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 17px}
.tr-scene h4{font-size:14px;margin-bottom:7px}
.tr-scene li{font-size:14px;color:var(--ink-2);line-height:1.55;margin-bottom:4px}
.tr-scene ol{margin:0;padding-left:20px}
@media (max-width:560px){.time{order:5;width:100%;text-align:center}.caption p{font-size:15.5px}}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
</style>

/* ---------------- SIGNS, SIGNALS & MARKINGS ---------------- */
["signs","An eight-sided (octagonal) sign always means:",["Come to a complete stop","Slow down and look both ways","Yield to cross traffic","The road narrows ahead"],0,"The octagon is reserved for one message only \u2014 STOP. Come to a full stop at the stop line, the crosswalk, or the corner, whichever you reach first."],

["signs","A flashing RED traffic light means:",["Stop completely, then go when it is safe","Slow down and proceed","The signal is broken \u2014 proceed normally","Stop and wait for the light to change"],0,"A flashing red is treated exactly like a stop sign: full stop, yield to traffic and pedestrians, then proceed when clear."],

["signs","A green arrow shown with a red light means:",["You may turn in the direction of the arrow \u2014 that movement is protected","You may go straight only","You must wait for the red to clear first","Turn only if no sign forbids it"],0,"A green arrow is a protected movement. Conflicting traffic is being held by a red light, but you must still yield to any pedestrians already in the crosswalk."],

["az","For the first 6 months with a Class G license, you may not carry:",["More than one passenger under 18 who is not an immediate family member","Any passengers at all","More than three passengers","Passengers over 18"],0,"Siblings and other immediate family do not count against the limit."],
["az","A Class G license holder generally may not drive between:",["Midnight and 5 a.m.","10 p.m. and 6 a.m.","11 p.m. and 4 a.m.","1 a.m. and 6 a.m."],0,"Exceptions cover travel to or from work or school, a family emergency, or driving with a parent or guardian 21 or older."],
["az","You may turn left on a red light in Arizona when:",["Turning from a one-way street onto another one-way street, after stopping","Never","Any time traffic is clear","Only between midnight and 5 a.m."],0,"Stop completely first, yield to pedestrians and cross traffic, and only if no sign prohibits it."],
["az","You must use your headlights:",["From sunset to sunrise, and whenever visibility is less than 500 feet","Only between 10 p.m. and 5 a.m.","Only in rain","Only on unlit roads"],0,"Dust, rain and smoke all trigger the 500-foot rule. Daytime running lights do not count as headlights."],
["az","You must dim your high beams when an oncoming vehicle is within:",["500 feet","200 feet","100 feet","1,000 feet"],0,"Dim at 500 feet for oncoming traffic, and within 200 feet when following another vehicle."],
["az","After moving, you must notify the Arizona MVD of your new address within:",["10 days","30 days","60 days","6 months"],0,"Arizona gives you 10 days. Renewal notices and suspension letters go to the address on file."],
["az","While driving in Arizona you are required to carry:",["Your license, vehicle registration and proof of insurance","Your license only","Your license and registration only","Only proof of insurance"],0,"All three must be produced on request by a peace officer."],
["az","You are stopped at a railroad crossing behind another car. You should:",["Never start across until there is room for your entire vehicle on the other side","Follow closely to clear the tracks faster","Cross as soon as the gate lifts","Stop on the tracks if traffic backs up"],0,"Never let your vehicle end up stranded on the tracks. Wait until there is space clear on the far side."],
["az","Sounding your horn is appropriate:",["To warn others of danger","To express frustration","To greet someone you know","To hurry a slow driver"],0,"The horn is a safety device, not a comment. Use it briefly to alert someone who does not see you."],
["az","A U-turn is prohibited:",["Where a sign forbids it or where you cannot be seen for 200 feet in each direction","Only on freeways","Only in business districts","Only at night"],0,"Visibility is the key test. If oncoming traffic cannot see you in time, the turn is illegal."],
["az","On a road with a center left-turn lane (marked with broken yellow lines on both sides), you may:",["Use it only to prepare for a left turn or to turn left from a driveway","Drive in it to pass slower traffic","Use it as a travel lane for up to 300 feet","Park in it briefly"],0,"The shared center lane is for turning, not traveling. Enter it just before your turn."],
["az","If your Arizona vehicle registration or insurance lapses, you may:",["Have your registration suspended and face fines and reinstatement fees","Continue driving for 90 days","Drive only during daylight","Face no penalty until renewal"],0,"Arizona verifies insurance electronically. Coverage must be continuous."],

["emerg","Why should you turn your lights OFF after pulling off the road in a dust storm?",["So other drivers do not mistake your taillights for the road and drive into you","To save battery power","Because lights reflect off the dust into your eyes","Because it is required at all roadside stops"],0,"Drivers in a whiteout follow any light they can see. A lit car on the shoulder pulls them straight into you."],

["emerg","A front tire blows out at highway speed. You should:",["Grip the wheel firmly, ease off the accelerator and let the car slow before steering off the road","Brake hard immediately","Steer sharply onto the shoulder","Accelerate to stabilize"],0,"Hard braking during a blowout can spin the car. Hold your line, coast down, then pull off."],

["emerg","Your accelerator sticks while driving. Your first action should be:",["Shift into neutral and brake, then steer off the road","Turn off the ignition immediately","Pull the parking brake","Open the door and jump out"],0,"Neutral disconnects the engine from the wheels. Shutting off the ignition can lock the steering."],

["emerg","When driving into bright low sun you should:",["Use the visor and sunglasses, slow down and increase your following distance","Follow closely to use the car ahead as a shield","Use high beams","Look down at the lane markings"],0,"Glare hides pedestrians and brake lights. A dirty windshield makes it far worse \u2014 keep it clean."],

const SH={
  oct:"30,3 70,3 97,30 97,70 70,97 30,97 3,70 3,30",

  tri:"3,9 97,9 50,95",

const sc=(x,y,s)=>`translate(${x},${y}) scale(${s}) translate(${-x},${-y})`;
const fill=(p,f,tr="")=>`<polygon points="${p}" fill="${f}"${tr?` transform="${tr}"`:""}/>`;
const ring=(p,c,w,x,y,s)=>`<polygon points="${p}" fill="none" stroke="${c}" stroke-width="${w}" transform="${sc(x,y,s)}"/>`;
const warn=(body,bg="#FFD100")=>fill(SH.dia,bg)+ring(SH.dia,"#111",4,50,50,.87)+body;
const PED='<circle cx="50" cy="22" r="8" fill="#111"/>'+
  '<path d="M50,31 L50,56" stroke="#111" stroke-width="9" stroke-linecap="round"/>'+

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
}
const clamp01=v=>v<0?0:v>1?1:v;
const seg=(p,a,b)=>clamp01((p-a)/(b-a));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const lerp=(a,b,t)=>a+(b-a)*t;

function mkG(ctx){
  const g={ctx,W:LW,H:LH};
  const path=(fn)=>{ctx.beginPath();fn();};
  g.clear=()=>{ctx.fillStyle=C.bg;ctx.fillRect(0,0,LW,LH);};
  g.box=(x,y,w,h,c,r=0)=>{ctx.fillStyle=c;path(()=>ctx.roundRect(x,y,w,h,r));ctx.fill();};
  g.stroke=(x,y,w,h,c,lw=2,r=0)=>{ctx.strokeStyle=c;ctx.lineWidth=lw;
    path(()=>ctx.roundRect(x,y,w,h,r));ctx.stroke();};
  g.dot=(x,y,r,c)=>{ctx.fillStyle=c;path(()=>ctx.arc(x,y,r,0,7));ctx.fill();};
  g.ring=(x,y,r,c,lw=3)=>{ctx.strokeStyle=c;ctx.lineWidth=lw;path(()=>ctx.arc(x,y,r,0,7));ctx.stroke();};
  g.line=(x1,y1,x2,y2,c,lw=3,dash)=>{ctx.save();ctx.strokeStyle=c;ctx.lineWidth=lw;
    ctx.lineCap="round";if(dash)ctx.setLineDash(dash);
    path(()=>{ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);});ctx.stroke();ctx.restore();};
  g.poly=(pts,c,close=true)=>{ctx.fillStyle=c;path(()=>{pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));if(close)ctx.closePath();});ctx.fill();};
  g.txt=(s,x,y,o={})=>{ctx.save();ctx.fillStyle=o.c||C.ink;
    const fam=o.mono?'ui-monospace,Menlo,monospace':'-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif';
    ctx.font=`${o.w||600} ${o.s||16}px ${fam}`;
    ctx.textAlign=o.a||"left";ctx.textBaseline=o.b||"middle";
    if(o.alpha!=null)ctx.globalAlpha=o.alpha;
    ctx.fillText(s,x,y);ctx.restore();};
  g.arrow=(x1,y1,x2,y2,c,lw=4)=>{const a=Math.atan2(y2-y1,x2-x1),h=6+lw*1.5;
    g.line(x1,y1,x2-Math.cos(a)*h*.8,y2-Math.sin(a)*h*.8,c,lw);
    ctx.fillStyle=c;path(()=>{ctx.moveTo(x2,y2);
      ctx.lineTo(x2-Math.cos(a-.42)*h,y2-Math.sin(a-.42)*h);
      ctx.lineTo(x2-Math.cos(a+.42)*h,y2-Math.sin(a+.42)*h);});ctx.fill();};
  g.hroad=(y,h)=>{g.box(0,y-h/2,LW,h,C.road);
    g.box(0,y-h/2-4,LW,4,C.shoulder);g.box(0,y+h/2,LW,4,C.shoulder);};
  g.vroad=(x,w)=>{g.box(x-w/2,0,w,LH,C.road);
    g.box(x-w/2-4,0,4,LH,C.shoulder);g.box(x+w/2,0,4,LH,C.shoulder);};
  g.car=(x,y,a,col,o={})=>{ctx.save();ctx.translate(x,y);ctx.rotate(a||0);
    const s=o.s||1;ctx.scale(s,s);
    ctx.fillStyle="rgba(0,0,0,.30)";path(()=>ctx.roundRect(-23,-9,48,23,6));ctx.fill();
    g.box(-24,-11,48,22,col,6);
    g.box(-11,-8,17,16,"rgba(0,0,0,.34)",3);
    if(o.brake!==false){ctx.fillStyle=o.brake?"#FF6152":"rgba(255,255,255,.28)";
      path(()=>ctx.roundRect(-24,-9,4,6,1.5));ctx.fill();path(()=>ctx.roundRect(-24,3,4,6,1.5));ctx.fill();}
    if(o.lights!==false){ctx.fillStyle=o.lights?"#FFF3C4":"rgba(255,255,255,.5)";
      path(()=>ctx.roundRect(19,-8,5,5,1.5));ctx.fill();path(()=>ctx.roundRect(19,3,5,5,1.5));ctx.fill();}
    ctx.restore();};
  g.truck=(x,y,a,col)=>{ctx.save();ctx.translate(x,y);ctx.rotate(a||0);
    g.box(-70,-13,52,26,"#DCE3DD",4); g.box(22,-14,32,28,col,5);
    g.box(-16,-9,34,18,"#B9C2BA",3); g.box(34,-10,12,20,"rgba(0,0,0,.32)",3);
    ctx.restore();};
  g.bike=(x,y,a,col)=>{ctx.save();ctx.translate(x,y);ctx.rotate(a||0);
    g.ring(-9,0,7,col||C.good,2.5); g.ring(9,0,7,col||C.good,2.5);
    g.line(-9,0,2,-6,col||C.good,2.5); g.line(9,0,2,-6,col||C.good,2.5);
    g.dot(2,-11,4,col||C.good); ctx.restore();};
  g.bus=(x,y,a,o={})=>{ctx.save();ctx.translate(x,y);ctx.rotate(a||0);
    g.box(-62,-15,124,30,"#F2C230",5); g.box(-52,-10,30,20,"rgba(0,0,0,.22)",3);
    g.box(40,-10,14,20,"rgba(0,0,0,.28)",3);

    g.dot(-56,-19,5,on?"#FF4632":"#6B2F28"); g.dot(56,-19,5,on?"#FF4632":"#6B2F28");
    g.dot(-56,19,5,on?"#FF4632":"#6B2F28"); g.dot(56,19,5,on?"#FF4632":"#6B2F28");
    ctx.restore();};
  g.ped=(x,y,s=1,col)=>{ctx.save();ctx.translate(x,y);ctx.scale(s,s);
    g.dot(0,-16,6,col||C.white); g.line(0,-10,0,4,col||C.white,5);
    g.line(0,-6,-8,2,col||C.white,4); g.line(0,-6,8,1,col||C.white,4);
    g.line(0,4,-7,18,col||C.white,4.5); g.line(0,4,7,18,col||C.white,4.5); ctx.restore();};

  g.title=(t,sub)=>{g.txt(t,34,42,{s:26,w:800,c:C.ink});
    if(sub)g.txt(sub,34,72,{s:15,w:500,c:C.dim});};
  g.signpost=(x,y,shape,fillc,label,o={})=>{ctx.save();ctx.translate(x,y);
    const r=o.r||34;ctx.fillStyle=fillc;ctx.beginPath();
    if(shape==="oct"){for(let i=0;i<8;i++){const a=Math.PI/8+i*Math.PI/4;
      const px=Math.cos(a)*r,py=Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}}
    else if(shape==="tri"){ctx.moveTo(-r,-r*.8);ctx.lineTo(r,-r*.8);ctx.lineTo(0,r*.9);}
    else if(shape==="dia"){ctx.moveTo(0,-r);ctx.lineTo(r,0);ctx.lineTo(0,r);ctx.lineTo(-r,0);}
    else if(shape==="pen"){ctx.moveTo(0,-r);ctx.lineTo(r,-r*.28);ctx.lineTo(r*.62,r*.85);
      ctx.lineTo(-r*.62,r*.85);ctx.lineTo(-r,-r*.28);}
    else if(shape==="pnt"){ctx.moveTo(-r,-r*.72);ctx.lineTo(r,0);ctx.lineTo(-r,r*.72);}
    else if(shape==="cir"){ctx.arc(0,0,r,0,7);}
    else {ctx.roundRect(-r*.78,-r,r*1.56,r*2,4);}
    ctx.closePath();ctx.fill();
    if(o.border){ctx.strokeStyle=o.border;ctx.lineWidth=3;ctx.stroke();}
    if(label)g.txt(label,0,o.ly||0,{s:o.ls||13,c:o.lc||"#111",a:"center",w:800});
    ctx.restore();};
  return g;
}
/* fit a canvas to its CSS box at device resolution, logical coords stay 800x450 */
function fitCanvas(cv){
  const r=cv.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
  const w=Math.max(1,Math.round(r.width*dpr));
  if(cv.width!==w){cv.width=w;cv.height=Math.round(w*LH/LW);}
  const ctx=cv.getContext("2d");
  ctx.setTransform(cv.width/LW,0,0,cv.width/LW,0,0);
  return ctx;
}

/* ================= storage ================= */
const KEY="az-permit-prep/v1";
const blank={attempts:[],stats:{},instant:true,watched:{},voice:false};
let S=blank;
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign({},blank,JSON.parse(raw));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const stat=id=>S.stats[id]||{r:0,w:0};
const missedIds=()=>Object.keys(S.stats).filter(id=>byId[id]&&S.stats[id].w>S.stats[id].r);

function catAccuracy(cat){
  let r=0,w=0;
  inCat(cat).forEach(q=>{const s=stat(q.id); r+=s.r; w+=s.w;});
  return {seen:r+w, pct: r+w ? Math.round(r/(r+w)*100) : null};
}
function overall(){
  let r=0,w=0; Object.values(S.stats).forEach(s=>{r+=s.r;w+=s.w;});
  return {r,w,pct: r+w ? Math.round(r/(r+w)*100) : null};
}

/* ================= utils ================= */
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(arr,n){return shuffle(arr).slice(0,n);}
const road = pct => `<div class="road" style="--pct:${pct}%"><div class="road-fill"></div><div class="road-dash"></div></div>`;

/* build a shuffled instance of a question */
function instance(q){
  const order = shuffle(q.opts.map((t,i)=>({t,ok:i===q.c})));
  return {id:q.id, cat:q.cat, sign:q.sign, q:q.q, why:q.why, opts:order,
          c:order.findIndex(o=>o.ok)};
}

/* balanced draw across every topic, for the full exam */
function examSet(n){
  const keys=Object.keys(CATS), per=Math.floor(n/keys.length);
  let out=[];
  keys.forEach(k=>{out=out.concat(pick(inCat(k),per));});
  const rest=ALL.filter(q=>!out.includes(q));
  out=out.concat(pick(rest,n-out.length));
  return shuffle(out).map(instance);
}

/* ================= app state ================= */
let view="home", sess=null;

const MODES={
  exam:  {label:"Practice Exam",  build:()=>examSet(EXAM_N),                      instant:false},
  quick: {label:"Quick Quiz",     build:()=>pick(ALL,10).map(instance),           instant:true},
  signs: {label:"Road Signs Drill",build:()=>shuffle(SIGNS).map(s=>instance(byId["s_"+s.id])), instant:true},
  missed:{label:"Missed Questions",build:()=>pick(missedIds().map(id=>byId[id]),20).map(instance), instant:true}
};

function start(mode,cat){
  let qs, label;
  if(mode==="topic"){ qs=pick(inCat(cat),Math.min(20,inCat(cat).length)).map(instance); label=CATS[cat].name; }
  else { qs=MODES[mode].build(); label=MODES[mode].label; }
  if(!qs.length) return;
  sess={mode,cat,label,qs,i:0,picked:null,answers:[],
        instant: mode==="exam" ? false : (mode==="topic"||mode==="quick"||mode==="signs"||mode==="missed") ? S.instant : true};
  view="quiz"; render();
}

function disclaimer(){

/* ---------------- quiz runner ---------------- */
function quizView(){
  const q=sess.qs[sess.i], n=sess.qs.length, answered=sess.picked!==null;
  const right=sess.answers.filter(a=>a.ok).length, wrong=sess.answers.length-right;

  const opts = q.opts.map((o,i)=>{
    let cls="opt";
    if(answered){
      if(sess.instant){
        if(i===q.c) cls+=" is-right";
        else if(i===sess.picked) cls+=" is-wrong";
        else cls+=" is-dim";
      } else if(i===sess.picked) cls+=" is-picked";
    }
    return `<button class="${cls}" data-act="pick" data-i="${i}"${answered?" disabled":""}>
      <span class="key">${"ABCD"[i]}</span><span>${esc(o.t)}</span></button>`;
  }).join("");

  const fb = (answered && sess.instant) ? (()=>{
    const ok=sess.picked===q.c;
    return `<div class="feedback${ok?"":" bad"}"><b>${ok?"Correct":"Not quite"}</b>
      ${ok?"":`<p style="color:var(--ink)">The answer is <b style="color:var(--go)">${esc(q.opts[q.c].t)}</b>.</p>`}
      <p>${esc(q.why)}</p></div>`;})() : "";

  const last = sess.i===n-1;
  return `<div class="runner fade">
    <div class="runner-bar">
      <span class="mile">${String(sess.i+1).padStart(2,"0")} / ${n}</span>
      <span class="runner-title">${esc(sess.label)}</span>
      <span class="runner-right">
        ${sess.instant?`<span class="tally"><b>${right}</b> right \u00b7 <i>${wrong}</i> wrong</span>`:
          `<span class="tally">${sess.answers.length} answered</span>`}
        <button class="btn btn-sm" data-act="go" data-view="home">Exit</button>
      </span>
    </div>
    ${road(Math.round(sess.i/n*100))}
    <div class="qcard">
      <span class="chip">${CATS[q.cat].name}</span>
      ${q.sign?`<div class="qsign">${signArt(q.sign)}</div>`:""}
      <h2 class="qtext">${esc(q.q)}</h2>
      <div class="opts" role="group">${opts}</div>
      <div aria-live="polite">${fb}</div>
      <div class="runner-foot">
        <button class="btn btn-primary" data-act="next"${answered?"":" disabled"}>
          ${last?"See results":"Next question"}</button>
        <span class="hint">Press 1\u20134 to answer${answered?" \u00b7 Enter to continue":""}</span>
      </div>
    </div>
  </div>`;
}

function pickAnswer(i){
  if(sess.picked!==null) return;
  const q=sess.qs[sess.i], ok=i===q.c;
  sess.picked=i;
  sess.answers.push({id:q.id, picked:i, ok, q});
  const s=S.stats[q.id]||(S.stats[q.id]={r:0,w:0});
  ok?s.r++:s.w++;
  save(); render();
}
function nextQ(){
  if(sess.picked===null) return;
  if(sess.i===sess.qs.length-1){ finish(); }
  else { sess.i++; sess.picked=null; render(); }
}
function finish(){
  const correct=sess.answers.filter(a=>a.ok).length, total=sess.qs.length;
  const pass=correct/total>=PASS;
  S.attempts.unshift({t:Date.now(), mode:sess.label, correct, total, pass});
  S.attempts=S.attempts.slice(0,25); save();
  view="results"; render();
}

/* ---------------- results ---------------- */
function resultsView(){
  const a=sess.answers, correct=a.filter(x=>x.ok).length, total=sess.qs.length;
  const pct=Math.round(correct/total*100), pass=correct/total>=PASS;
  const need=Math.ceil(total*PASS);
  const wrong=a.filter(x=>!x.ok);

  const cats={};
  a.forEach(x=>{const c=cats[x.q.cat]||(cats[x.q.cat]={r:0,n:0}); c.n++; if(x.ok)c.r++;});
  const breakdown=Object.entries(cats).sort((p,q)=>p[1].r/p[1].n-q[1].r/q[1].n).map(([k,v])=>{
    const p=Math.round(v.r/v.n*100);
    return `<button class="topic" data-act="start" data-mode="topic" data-cat="${k}">
      <span class="topic-n">${CATS[k].name}<small>${v.r} of ${v.n} correct \u2014 drill this topic</small></span>
      <span class="meter"><i style="--pct:${p}%"></i></span>
      <span class="topic-p">${p}%</span></button>`;}).join("");

  const review = wrong.map(x=>`<div class="rev-item">
      ${x.q.sign?`<div class="rev-sign">${signArt(x.q.sign)}</div>`:""}
      <p class="rev-q">${esc(x.q.q)}</p>
      <p class="rev-line">You chose <s>${esc(x.q.opts[x.picked].t)}</s></p>
      <p class="rev-line">Correct answer: <b>${esc(x.q.opts[x.q.c].t)}</b></p>
      <p class="rev-why">${esc(x.q.why)}</p></div>`).join("");

  return `<div class="stack fade" style="gap:26px">
    <div class="panel${pass?"":" fail"}">
      <span class="eyebrow" style="color:rgba(255,255,255,.75)">${esc(sess.label)} \u00b7 result</span>
      <span class="panel-verdict">${pass?"Passed":"Not yet"}</span>
      <span class="panel-score">${correct} / ${total} &middot; ${pct}%</span>
      <p class="panel-note">${pass
        ? (pct===100?"A clean sweep. Run the exam a few more times so it holds under pressure."
           :"Above the 80% line. Keep running exams until you clear it consistently.")
        : `You need ${need} of ${total} to pass. Review the misses below, then drill your weakest topic.`}</p>
    </div>

    <div class="hero-cta">
      <button class="btn btn-primary" data-act="start" data-mode="${sess.mode}"${sess.cat?` data-cat="${sess.cat}"`:""}>Take it again</button>
      ${missedIds().length?`<button class="btn" data-act="start" data-mode="missed">Drill my missed questions</button>`:""}
      <button class="btn" data-act="go" data-view="home">Back to home</button>
    </div>

    <section><div class="section-head"><h2>How each topic went</h2><span class="rule"></span>
      <span class="eyebrow">weakest first</span></div>
      <div class="topics">${breakdown}</div></section>

    ${wrong.length?`<section><div class="section-head"><h2>What you missed</h2><span class="rule"></span>
      <span class="eyebrow">${wrong.length} question${wrong.length>1?"s":""}</span></div>
      <div class="rev">${review}</div></section>`:""}
  </div>`;
}
/* ---------------- sign chart ---------------- */
function signsView(){
  return `<div class="fade">
    <div class="section-head" style="margin-top:6px"><h2>Every sign you need to know</h2><span class="rule"></span>
      <button class="btn btn-sm btn-primary" data-act="start" data-mode="signs">Drill these</button></div>
    <p class="hero-sub" style="margin-bottom:18px;font-size:15.5px">Shape and color carry meaning before you
      read a single word. Learn those first \u2014 on the test and on the road, they are often all you get.</p>
    <div class="signgrid">${SIGNS.map(s=>`<div class="signcard">
      <svg class="sgn" viewBox="0 0 100 100" role="img" aria-label="${s.name} sign">${s.art}</svg>
      <h4>${s.name}</h4><span class="eyebrow" style="font-size:10.5px">${s.cls}</span>
      <p>${s.mean}</p></div>`).join("")}</div>
    ${disclaimer()}</div>`;
}

/* ---------------- progress ---------------- */
function progressView(){
  const o=overall(), att=S.attempts;
  const hist = att.length ? `<div class="card tablewrap"><table class="hist"><thead><tr>
      <th>When</th><th>Mode</th><th>Score</th><th>Result</th></tr></thead><tbody>${
      att.map(a=>{const p=Math.round(a.correct/a.total*100);
        return `<tr><td>${new Date(a.t).toLocaleDateString(undefined,{month:"short",day:"numeric"})}
          ${new Date(a.t).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}</td>
          <td>${esc(a.mode)}</td><td class="num">${a.correct}/${a.total} \u00b7 ${p}%</td>
          <td><span class="chip ${a.pass?"chip-go":"chip-stop"}">${a.pass?"Pass":"Below 80%"}</span></td></tr>`;
        }).join("")}</tbody></table></div>`
    : `<div class="card empty">No tests yet. Take the practice exam and your history shows up here.</div>`;

  const topics = `<div class="topics">${Object.entries(CATS).map(([k,c])=>{const a=catAccuracy(k);
    return `<button class="topic" data-act="start" data-mode="topic" data-cat="${k}">
      <span class="topic-n">${c.name}<small>${a.seen?a.seen+" answered":"not started"}</small></span>
      <span class="meter"><i style="--pct:${a.pct||0}%"></i></span>
      <span class="topic-p">${a.pct===null?"\u2014":a.pct+"%"}</span></button>`;}).join("")}</div>`;

  return `<div class="fade">
    <div class="section-head" style="margin-top:6px"><h2>Your progress</h2><span class="rule"></span>
      <span class="eyebrow">${o.r+o.w} answers recorded</span></div>
    <div class="stats">
      <div class="stat"><span class="stat-v">${att.length}</span><span class="stat-l">Tests taken</span></div>
      <div class="stat"><span class="stat-v">${att.length?Math.max(...att.map(a=>Math.round(a.correct/a.total*100)))+"%":"\u2014"}</span><span class="stat-l">Best score</span></div>
      <div class="stat"><span class="stat-v">${o.pct===null?"\u2014":o.pct+"%"}</span><span class="stat-l">Overall accuracy</span></div>
      <div class="stat"><span class="stat-v">${missedIds().length}</span><span class="stat-l">Shaky questions</span></div>
    </div>
    <div class="section-head"><h2>By topic</h2><span class="rule"></span></div>
    ${topics}
    <div class="section-head"><h2>Test history</h2><span class="rule"></span></div>
    ${hist}
    <div class="hero-cta" style="margin-top:22px">
      <button class="btn btn-primary" data-act="start" data-mode="exam">Take a practice exam</button>
      <button class="btn" data-act="reset">Reset all progress</button>

    ${disclaimer()}</div>`;
}

/* ---------------- lesson player ---------------- */
const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const PL={lesson:null,t:0,playing:false,rate:1,raf:null,last:0,g:null,cv:null,line:-1};
const ICON={
  play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
  prev:'<svg viewBox="0 0 24 24"><path d="M6 6h2.5v12H6zm3.5 6l9.5-6v12z"/></svg>',
  next:'<svg viewBox="0 0 24 24"><path d="M15.5 6H18v12h-2.5zM5 6l9.5 6L5 18z"/></svg>',
  replay:'<svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>'
};
const lTotal=L=>L.scenes.reduce((a,s)=>a+s.dur,0);
function lAt(L,t){let acc=0;
  for(let i=0;i<L.scenes.length;i++){const d=L.scenes[i].dur;
    if(t<acc+d||i===L.scenes.length-1)return{i,p:clamp01((t-acc)/d),start:acc};
    acc+=d;}
  return{i:0,p:0,start:0};}
const lStart=(L,i)=>L.scenes.slice(0,i).reduce((a,s)=>a+s.dur,0);
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
function curLine(sc,p){const n=sc.say.length;return Math.min(n-1,Math.floor(p*n));}

function speak(txt){
  if(!S.voice||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.rate=.98*PL.rate;u.pitch=1;u.lang="en-US";speechSynthesis.speak(u);}catch(e){}
}
const hush=()=>{try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}};

function plDraw(){
  if(!PL.g||!PL.lesson)return;
  const {i,p}=lAt(PL.lesson,PL.t);
  PL.g.clear();
  try{PL.lesson.scenes[i].draw(PL.g,RM&&!PL.playing?1:p);}catch(e){}
}
function plSync(){
  const L=PL.lesson;if(!L)return;
  const tot=lTotal(L),{i,p}=lAt(L,PL.t),sc=L.scenes[i];
  const set=(id,fn)=>{const el=document.getElementById(id);if(el)fn(el);};
  set("scrub",e=>{if(document.activeElement!==e)e.value=String(PL.t);});
  set("ptime",e=>e.textContent=mmss(PL.t)+" / "+mmss(tot));
  set("scenetag",e=>e.textContent=`Scene ${i+1} of ${L.scenes.length} \u2014 ${sc.t}`);
  const li=curLine(sc,p);
  set("cap",e=>{if(PL.line!==li||e.textContent!==sc.say[li]){e.textContent=sc.say[li];}});
  if(PL.line!==li){if(PL.playing)speak(sc.say[li]);PL.line=li;}
  document.querySelectorAll("[data-ch]").forEach(b=>
    b.setAttribute("aria-current",String(+b.dataset.ch===i)));
  set("stage",e=>e.classList.toggle("is-paused",!PL.playing));
  set("bigplay",e=>e.innerHTML=PL.t>=tot?ICON.replay:ICON.play);
  set("playbtn",e=>e.innerHTML=PL.playing?ICON.pause:(PL.t>=lTotal(L)?ICON.replay:ICON.play));
}
function plTick(ts){
  if(!PL.playing){PL.raf=null;return;}
  if(!PL.last)PL.last=ts;
  const dt=Math.min(.12,(ts-PL.last)/1000)*PL.rate;PL.last=ts;
  PL.t+=dt;
  const tot=lTotal(PL.lesson);
  if(PL.t>=tot){PL.t=tot;PL.playing=false;PL.raf=null;
    S.watched[PL.lesson.id]=true;save();plDraw();plSync();return;}
  plDraw();plSync();
  PL.raf=requestAnimationFrame(plTick);
}
function plPlay(){
  if(!PL.lesson)return;
  if(PL.t>=lTotal(PL.lesson))PL.t=0;
  PL.playing=true;PL.last=0;PL.line=-1;
  if(!PL.raf)PL.raf=requestAnimationFrame(plTick);
  plSync();
}
function plPause(){PL.playing=false;if(PL.raf){cancelAnimationFrame(PL.raf);PL.raf=null;}hush();plDraw();plSync();}
function plToggle(){PL.playing?plPause():plPlay();}
function plSeek(t){PL.t=Math.max(0,Math.min(lTotal(PL.lesson),t));PL.line=-1;hush();plDraw();plSync();}
function plScene(i){const L=PL.lesson;i=Math.max(0,Math.min(L.scenes.length-1,i));plSeek(lStart(L,i));}
function plStop(){PL.playing=false;if(PL.raf){cancelAnimationFrame(PL.raf);PL.raf=null;}hush();PL.lesson=null;}

function plMount(){
  const cv=document.getElementById("stage-canvas");if(!cv)return;
  PL.cv=cv;PL.g=mkG(fitCanvas(cv));plDraw();plSync();
  if(!RM)plPlay();
}
function mountThumbs(){
  document.querySelectorAll("canvas[data-lesson]").forEach(cv=>{
    const L=LESSONS.find(x=>x.id===cv.dataset.lesson);if(!L)return;
    const g=mkG(fitCanvas(cv));g.clear();
    try{L.scenes[0].draw(g,1);}catch(e){}});
}
addEventListener("resize",()=>{
  if(view==="lesson"&&PL.cv){PL.g=mkG(fitCanvas(PL.cv));plDraw();}
  else if(view==="lessons"||view==="home")mountThumbs();
});

/* ---------------- lesson views ---------------- */
function lessonsView(){
  const done=Object.keys(S.watched||{}).length;
  return `<div class="fade">
    <div class="section-head" style="margin-top:6px"><h2>Animated lessons</h2><span class="rule"></span>
      <span class="eyebrow">${done} of ${LESSONS.length} watched</span></div>
    <p class="hero-sub" style="margin-bottom:20px;font-size:15.5px">Every topic on the test, shown rather than
      listed. Each lesson plays as a narrated animation you can pause, scrub and replay \u2014 turn on the voice-over
      in the player if you would rather listen than read.</p>
    ${lessonCards()}
    ${disclaimer()}</div>`;
}
function lessonCards(){
  return `<div class="lessongrid">${LESSONS.map(L=>`
    <button class="lcard" data-act="lesson" data-id="${L.id}">
      <span class="lcard-art"><canvas data-lesson="${L.id}"></canvas>
        <span class="lcard-dur">${mmss(lTotal(L))}</span>
        ${S.watched&&S.watched[L.id]?'<span class="lcard-seen">Watched</span>':""}</span>
      <span class="lcard-b"><h3>${L.name}</h3><p>${L.blurb}</p>
        <span class="mode-meta">${L.scenes.length} scenes \u00b7 ${mmss(lTotal(L))}</span></span>
    </button>`).join("")}</div>`;
}
function lessonView(){
  const L=PL.lesson,tot=lTotal(L),{i}=lAt(L,PL.t),sc=L.scenes[i];
  const idx=LESSONS.indexOf(L),nxt=LESSONS[idx+1];
  return `<div class="player fade">
    <div class="runner-bar">
      <span class="mile">${String(idx+1).padStart(2,"0")} / ${String(LESSONS.length).padStart(2,"0")}</span>
      <span class="runner-title">${esc(L.name)}</span>
      <span class="runner-right">
        <label class="switch"><input type="checkbox" data-act="voice"${S.voice?" checked":""}> Voice-over</label>
        <button class="btn btn-sm" data-act="go" data-view="lessons">All lessons</button>
      </span>
    </div>

    <div class="stage${PL.playing?"":" is-paused"}" id="stage">
      <canvas id="stage-canvas"></canvas>
      <span class="scene-tag" id="scenetag">Scene ${i+1} of ${L.scenes.length} \u2014 ${esc(sc.t)}</span>
      <span class="stage-veil"><button class="bigplay" id="bigplay" data-act="play"
        aria-label="Play lesson">${ICON.play}</button></span>
    </div>

    <div class="controls">
      <button class="ctrl" data-act="scene-prev" aria-label="Previous scene">${ICON.prev}</button>
      <button class="ctrl ctrl-main" id="playbtn" data-act="play" aria-label="Play or pause">${ICON.play}</button>
      <button class="ctrl" data-act="scene-next" aria-label="Next scene">${ICON.next}</button>
      <input class="scrub" id="scrub" type="range" min="0" max="${tot}" step="0.1" value="${PL.t}"
        data-act="scrub" aria-label="Scrub through the lesson">
      <span class="time" id="ptime">${mmss(PL.t)} / ${mmss(tot)}</span>
      <button class="rate" data-act="rate">${PL.rate}&times;</button>
    </div>

    <div class="caption"><span class="eyebrow">Narration</span>
      <p id="cap" aria-live="polite">${esc(sc.say[curLine(sc,lAt(L,PL.t).p)])}</p></div>

    <div class="chapters">${L.scenes.map((s,n)=>
      `<button class="chapter" data-act="chapter" data-ch="${n}"
        aria-current="${n===i}"><b>${n+1}</b>${esc(s.t)}</button>`).join("")}</div>

    <div class="hero-cta" style="margin-top:8px">
      <button class="btn btn-primary" data-act="start" data-mode="topic" data-cat="${L.cat}">
        Quiz me on ${esc(L.name)}</button>
      ${nxt?`<button class="btn" data-act="lesson" data-id="${nxt.id}">Next: ${esc(nxt.name)}</button>`:
        `<button class="btn" data-act="start" data-mode="exam">Take the full practice exam</button>`}
    </div>

    <div class="section-head"><h2>Transcript</h2><span class="rule"></span>
      <span class="eyebrow">everything said in this lesson</span></div>
    <div class="transcript">${L.scenes.map((s,n)=>`<div class="tr-scene">
      <h4>${n+1}. ${esc(s.t)}</h4><ol>${s.say.map(t=>`<li>${esc(t)}</li>`).join("")}</ol></div>`).join("")}</div>
    ${disclaimer()}</div>`;
}
function openLesson(id){
  const L=LESSONS.find(x=>x.id===id);if(!L)return;
  plStop();PL.lesson=L;PL.t=0;PL.line=-1;PL.playing=false;
  view="lesson";render();
}

/* ---------------- router ---------------- */
function render(){
  const app=$("#app");
  app.innerHTML = view==="quiz" ? quizView()
    : view==="results" ? resultsView()
    : view==="lesson" ? lessonView()
    : view==="lessons" ? lessonsView()
    : view==="signs" ? signsView()
    : view==="cheat" ? cheatView()
    : view==="progress" ? progressView()
    : homeView();
  renderNav();
  if(view==="lesson") plMount();
  if(view==="lessons"||view==="home") mountThumbs();
  if(view==="quiz"||view==="results"||view==="lesson") window.scrollTo({top:0,behavior:"instant"});
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act;
  if(act==="go"){ sess=null; plStop(); view=t.dataset.view; render(); }
  else if(act==="start"){ plStop(); start(t.dataset.mode,t.dataset.cat); }
  else if(act==="pick"){ pickAnswer(+t.dataset.i); }
  else if(act==="next"){ nextQ(); }
  else if(act==="lesson"){ openLesson(t.dataset.id); }
  else if(act==="play"){ plToggle(); }
  else if(act==="scene-prev"){ plScene(lAt(PL.lesson,PL.t).i-1); }
  else if(act==="scene-next"){ plScene(lAt(PL.lesson,PL.t).i+1); }
  else if(act==="chapter"){ plScene(+t.dataset.ch); }
  else if(act==="rate"){ PL.rate=PL.rate===1?1.5:PL.rate===1.5?.75:1; t.textContent=PL.rate+"\u00d7"; }
  else if(act==="reset"){
    if(confirm("Erase all scores, history, lesson progress and topic accuracy? This cannot be undone.")){
      S=JSON.parse(JSON.stringify(blank)); save(); render();
    }
  }
});
document.addEventListener("change",e=>{
  const a=e.target.dataset.act;
  if(a==="instant"){ S.instant=e.target.checked; save(); }
  else if(a==="voice"){ S.voice=e.target.checked; save(); if(!S.voice)hush(); }
});
document.addEventListener("input",e=>{
  if(e.target.dataset.act==="scrub"){ plSeek(parseFloat(e.target.value)); }
});
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(view==="lesson"){
    const tag=(e.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="button") return;
    if(e.key===" "||e.key==="k"){ e.preventDefault(); plToggle(); }
    else if(e.key==="ArrowRight"){ e.preventDefault(); plSeek(PL.t+5); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); plSeek(PL.t-5); }
    else if(e.key==="Escape"){ plStop(); view="lessons"; render(); }
    return;
  }
  if(view!=="quiz") return;
  if(/^[1-4]$/.test(e.key)){ const i=+e.key-1; if(i<sess.qs[sess.i].opts.length){ e.preventDefault(); pickAnswer(i); } }
  else if(e.key==="Enter"||e.key===" "){ if(sess.picked!==null){ e.preventDefault(); nextQ(); } }
  else if(e.key==="Escape"){ sess=null; view="home"; render(); }
});

render();
</script>
